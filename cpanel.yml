# .cpanel.yml
---
deployment:
  tasks:
    # حدد مسار النشر
    - export DOCUMENT_ROOT=/home/benswgge/public_html/bensaed-charity

    # لو عندك مجلد build أو dist (مثلاً من أي أدوات بناء مستقبلية)، انسخه للمسار
    - if [ -d "dist" ]; then
        /bin/cp -r dist/* $DOCUMENT_ROOT;
      elif [ -d "build" ]; then
        /bin/cp -r build/* $DOCUMENT_ROOT;
      else
        # لو لا build ولا dist، انسخ كل الملفات مباشرة
        /bin/cp -r * $DOCUMENT_ROOT;
      fi
